name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}


env:
  FOUNDRY_VERSION: "1.7.1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: setup foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: retry foundry setup on transient failure
        shell: bash
        run: |
          FOUNDRY_VERSION="${{ env.FOUNDRY_VERSION }}"
          FOUNDRYUP_BIN="$HOME/.foundry/bin/foundryup"
          FORGE_BIN="$HOME/.foundry/bin/forge"

          if command -v forge >/dev/null 2>&1; then
            forge --version
            exit 0
          fi

          if [ ! -x "$FOUNDRYUP_BIN" ]; then
            echo "foundryup was not installed by foundry-toolchain." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if "$FOUNDRYUP_BIN" --install "$FOUNDRY_VERSION"; then
              "$FORGE_BIN" --version
              exit 0
            fi
            echo "Foundry install attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 5))
          done

          echo "Foundry setup failed after retries." >&2
          exit 1

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: install dependencies
        run: forge install

      - name: install node deps (hardhat)
        run: npm ci

      - name: check formatting
        run: forge fmt --check

      - name: run unit tests
        run: forge test --color never

      - name: run deployed Diamond intent lifecycle integration
        run: forge test --match-contract IntentLifecycleIntegrationTest --color never

      - name: validate selector manifest and generate ABI
        run: npm run verify:contract-surface

      - name: validate repository consistency
        run: npm run verify:repo-consistency

      - name: run fuzz/stress tests (LibHeapStress)
        run: forge test --match-contract LibHeapStress -vvvv --color never

      - name: run gas benchmark (LibHeapGas) and upload report
        run: |
          forge test --gas-report --match-contract LibHeapGas --color never | tee gas-report.txt
      - name: upload gas-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gas-report
          path: gas-report.txt

      - name: verify diamond selectors (sepolia)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          if (-not $env:RPC_URL) { throw "SEPOLIA_RPC_URL is required for live selector verification on push" }
          if (-not (Test-Path "./scripts/ci-verify-selectors.ps1")) { throw "ci-verify-selectors.ps1 is required for live selector verification" }
          & ./scripts/ci-verify-selectors.ps1 -RpcUrl $env:RPC_URL

  slither:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: setup foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: install dependencies
        run: forge install

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5

      - name: run Slither
        run: |
          rm -f results.sarif
          slither contracts/ --sarif results.sarif --config-file .slither.config.json --fail-medium

      - name: Upload Slither SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: slither-sarif
          path: results.sarif

      - name: Upload Slither results to Code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: results.sarif
          category: slither
    
